name: ContactsPro

options:
  bundleIdPrefix: com.cenglou
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  ContactsPro:
    type: application
    platform: iOS
    sources:
      - path: ContactsPro
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cenglou.contactspro
        PRODUCT_NAME: ContactsPro
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""
    info:
      path: ContactsPro/Info.plist
      properties:
        CFBundleDisplayName: 柚柚通讯录
        CFBundleName: ContactsPro
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: zh_CN
        CFBundleLocalizations:
          - zh_CN
          - en
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: 用于解锁「隐私保险箱」中的加密联系人，保护你的私密人脉不被他人查看。
        NSContactsUsageDescription: 用于将系统通讯录中的联系人一次性导入到本应用中，数据仅保存在本机。
        NSPhotoLibraryUsageDescription: 用于从相册中为联系人选择头像。
        NSCameraUsageDescription: 用于扫描名片二维码，快速保存联系人。
        UIApplicationSupportsIndirectInputEvents: true
        UIStatusBarStyle: UIStatusBarStyleDefault
        UIRequiresFullScreen: false
