name: Build Unsigned IPA

# 触发条件：push 到 main/master 分支，或手动点 Run workflow
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: 编译未签名 IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 查看 Xcode 版本
        run: xcodebuild -version

      - name: 安装 XcodeGen（工程文件生成器）
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译（iphoneos / 无签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project ContactsPro.xcodeproj \
            -scheme ContactsPro \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | tail -30

      - name: 打包成 IPA
        run: |
          APP_PATH=$(find build/Build/Products -maxdepth 2 -name "ContactsPro.app" -type d | head -1)
          echo "找到 App：$APP_PATH"
          test -n "$APP_PATH" || { echo "没找到 .app，编译可能失败了"; exit 1; }
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry ContactsPro-unsigned.ipa Payload
          ls -lh ContactsPro-unsigned.ipa
          # 顺便把编译摘要打出来，方便排查
          echo "--- 构建告警统计 ---"
          grep -c "warning:" build.log || true

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: ContactsPro-unsigned-ipa
          path: ContactsPro-unsigned.ipa
          retention-days: 90
          if-no-files-found: error
